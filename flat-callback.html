<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Connecting Flat.io - LEDsplay</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/landing.css">
</head>
<body>
<main id="content" class="container" style="padding:4rem 1rem;max-width:36rem">
  <h1>Connecting Flat.io…</h1>
  <p id="message">Returning to your LEDsplay.</p>
</main>
<script>
// Flat redirects here after sign-in. The device is on the local network (http://ledsplay.local or a LAN IP),
// which Flat does not accept as a redirect address, so this page hands code and state on to the device.
// The code is useless without the PKCE verifier kept on the device.
(function () {
  var params = new URLSearchParams(window.location.search);
  var message = document.getElementById('message');

  function fail(text) {
    message.textContent = text + ' Go back to the LEDsplay app and try again.';
  }

  function isLocalHost(host) {
    if (host === 'localhost' || host === '127.0.0.1' || /\.local$/i.test(host)) return true;
    var parts = host.split('.').map(Number);
    if (parts.length !== 4 || parts.some(function (p) { return !(p >= 0 && p <= 255); })) return false;
    return parts[0] === 10 || (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
      (parts[0] === 192 && parts[1] === 168);
  }

  var origin;
  try {
    var raw = params.get('state').replace(/-/g, '+').replace(/_/g, '/');
    origin = new URL(JSON.parse(atob(raw)).o);
  } catch (e) {
    return fail('This sign-in link is not valid.');
  }
  if (!/^https?:$/.test(origin.protocol) || origin.pathname !== '/' || !isLocalHost(origin.hostname)) {
    return fail('This sign-in link does not point to a LEDsplay device.');
  }

  var forward = new URLSearchParams();
  ['code', 'state', 'error'].forEach(function (key) {
    if (params.has(key)) forward.set(key, params.get(key));
  });
  window.location.replace(origin.origin + '/api/flat/oauth/callback?' + forward.toString());
})();
</script>
</body>
</html>
